p1:
  data_dir: data/karaoke
  out_dir: results/p1
  sr: 44100
  hop: 441
  audio_wav:
    decode: auto
    sr: 44100
    subtype: PCM_16
  align:
    search_min_s: -30.0
    search_max_s: 30.0
    local_window_bars: 8
    local_range_s: 0.15
    blur_sigma_s: 0.02
    drum_weight: 2.0
    warn_scale_dev: 0.002
    warn_residual_s: 0.03
    w_on: 0.5
    w_ch: 0.5
    margin_min: 0.5
    second_peak_exclude_s: 0.2
    min_overlap_ratio: 0.5
    chroma_n_fft: 8192
    min_onsets_per_window: 16
    min_windows: 6
    edge_tol_s: 0.02
    warn_edge_ratio: 0.2
    render_confirm_tol_s: 0.02
    feature_bias_s: 0.01
    midi_render_gap_warn_ms: 20
  countin:
    max_bars: 3
    silence_db: 30
  render_tool:
    exe: 'C:\PhoenixMAX\PhoenixMain.exe'
    base_dir: 'C:\PhoenixMAX'
    mid_dir: 'C:\PhoenixMAX\mid'
    wav_dir: 'C:\PhoenixMAX\wav'
    extra_args: '-t 10'
    latency_s: 0.0
    w_on: 0.4
    w_ch: 0.4
    w_rms: 0.2
  delay_copy:
    min_ms: 5
    max_ms: 80
    jitter_ms: 10
    match_ratio: 0.7
  warp:
    method: local
    step_s: 2.0
    win_s: 8.0
    range_s: 0.3
    peak_margin: 0.08
    median_pts: 5
    max_dev_s: 0.3
    slope_min: 0.98
    slope_max: 1.02
    conf_min: 0.3
    ok_median_ms: 20
    ok_max_ms: 50
    band_s: 1.0
    median_s: 2.0
    w_chroma: 0.7
    w_onset: 0.3
  render:
    pitched_dbfs: -18
    drum_dbfs: -12
    peak_dbfs: -1
    rpp_ppq: 960
    seed: 0
  eval:
    onset_tol_s: 0.05
    offset_ratio: 0.2
    offset_min_tol_s: 0.05
    drum_stack_window_s: 0.02
  methods:
    muscriptor_models: [small, medium]
    demucs_model: htdemucs_ft
    demucs_6s_model: htdemucs_6s
    m4_muscriptor_model: medium
  preprocessing_variants:
    hpss:
      margin: [1.0, 3.0]
      harmonic_weight: 0.5
    residual_leveling:
      win_s: 1.5
      overlap_s: 0.5
      max_gain_db: 20.0
    time_stretch:
      rate: 0.5
    frequency_bands:
      cutoff_hz: [250.0, 1000.0, 4000.0]
      overlap_octaves: 0.3333333333333333
    repet:
      candidate_periods_bars: [4, 8, 12, 16, 24, 32, 48, 64]
  partial_tracking:
    n_fft: 4096
    hop: 441
    peak_threshold_db: -60.0
    freq_tolerance_cents: 50.0
    max_gap_frames: 3
    min_track_duration_s: 0.050
    pitch_split_semitones: 0.5
    harmonic_multiples: [2, 3, 4]
    harmonic_tolerance_cents: 50.0
    min_freq_hz: 27.5
    max_freq_hz: 4186.0
  official_pool:
    score: A
    # 採否は編集コストだけ。公式値は1曲抜きの平均。同じ曲で選んで測った数字は使わない。
    # P1-43 で、格子半分と役割別の一括削除の数え方に合わせて選び直した。
    # その他は下書きを出さない。方式の一覧は残す（外すと上限が 0 になる。削減率は 0 のまま）。
    # ドラムは 10回すべてに残った方式が無く、空にすると 0% なので変えていない。
    by_role:
      melody: [M2, M6, M8, M12, M15, M17, M18, M20, M1_delim, M2_delim, M6_delim, M_dereverb]
      bass: [M1, M2, M6, M11, M12, M13, M15, M19, M1_delim]
      # M3 は P2-2 で、抜いてもその他 union の下がりが 0.005 未満だったので外した。
      other: [M4, M6, M8, M10, M14, M16, M17, M20]
      drums: [M2, M11, M14, M15, drumsep_hihat]
    drumsep_file: drumsep_notes.json
    draft_velocity: 100
    drum_rep_pitch:
      kick: 36
      snare: 38
      clap: 39
      rim: 37
      hihat: 42
      tom: 45
      crash: 49
      ride: 51
      perc: 64
      cymbal: 52
      other: 56
  export_time:
    # 下書きは解析フレーム1つ分だけ遅れていた。hop 512 / 44100Hz。
    frame_hop_samples: 512
    sr: 44100
  region_edit:
    gap_s: 2.0
  near_miss:
    onset_tol_s: 0.05
    run_gap_s: 2.0
    legato_ignore_s: 0.05
    provisional_mono_ratio: 0.99
    fixed_window_s: 0.25
  edit_cost:
    onset_tol_s: 0.05
    quantize_tol_s: 0.30
    run_gap_s: 2.0
    bulk_del_min_notes: 3
    bulk_del_gap_s: 1.0
    empty_space_dist_s: 0.5
  # karaoke200 の納品ファイル。Fix の中の VD+6桁 を、10曲の final.mid / audio.mp3 に対応させる。
  delivery:
    source_dir: karaoke200
    vd_digits: 6

